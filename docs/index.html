<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nurture: watch a shared tab with flagged spoken words muted, using offline speech-to-text in your browser.">
  <title>Nurture</title>
  <link rel="stylesheet" href="style.css">
  <script src="filter.js" defer></script>
  <script src="words.js" defer></script>
  <script src="speech.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <div class="wrap">
    <header><a class="brand" href="./">nurture<span>.</span></a><nav aria-label="Main navigation"><a href="lab.html">Lab</a><a href="https://github.com/Shubin123/nurture">Source</a></nav></header>
    <main class="viewer">
      <div id="stage" class="stage">
        <video id="preview" muted playsinline aria-hidden="true"></video>
        <canvas id="delayed-preview" aria-label="Shared tab, delayed and with flagged words muted"></canvas>
        <div class="stage-center"><button id="share" type="button">Share a tab</button><p id="stage-message" class="stage-message" hidden></p></div>
        <div id="captions" class="captions" aria-live="off" aria-label="Captions with flagged words replaced"></div>
      </div>
      <div class="bar">
        <button id="stop" class="secondary" type="button" disabled>Stop</button>
        <label>Flagged words <select id="speech-mode"><option value="mute">Mute</option><option value="beep">Beep</option></select></label>
        <label>Delay <select id="speech-delay"><option value="3">3 s</option><option value="4" selected>4 s</option><option value="6">6 s</option><option value="8">8 s</option></select></label>
        <p id="status" role="status"></p>
      </div>
      <p class="fine">Speech-to-text runs offline in this page (Whisper tiny.en, about 55 MB downloaded from this site on first use). No audio or text is uploaded. Recognition can miss words. Pictures are not filtered.</p>
      <details class="words">
        <summary>Words to filter</summary>
        <div class="two">
          <div><label for="rules">Your words · <code>word = replacement</code>, one per line</label><textarea id="rules" rows="4" spellcheck="false">stupid = unhelpful
idiot = person</textarea><label for="exceptions">Never filter · one per line</label><textarea id="exceptions" rows="2" spellcheck="false" placeholder="e.g. black"></textarea></div>
          <fieldset class="sources"><legend>Word lists</legend><div id="lexicon-list"><p class="muted">Loading…</p></div><label for="list-replacement">Caption replacement for list words</label><input id="list-replacement" type="text" value="bleep" maxlength="80"><label for="lexicon-file">Add a .txt list (one word or phrase per line)</label><input id="lexicon-file" type="file" accept=".txt,text/plain"></fieldset>
        </div>
      </details>
    </main>
  </div>
</body>
</html>
